name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a deploy manually from the Actions tab

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/northbound-sessions-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # built-in, no setup needed

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App to use the new image
        run: |
          az containerapp update \
            --name northbound-sessions-web \
            --resource-group northbound-sessions-rg \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }}

# Notes:
#   - Replace "northbound-sessions-web" above with your Container App's
#     actual name if it differs (check the portal).
#   - First run: after this succeeds once, go to your GitHub profile/repo's
#     Packages tab, find the new "northbound-sessions-web" package, and set
#     its visibility to Public (see setup steps).
#   - Tagging with both the commit SHA and "latest" means you always have
#     an exact, traceable image per deploy, not just a moving "latest" tag.
