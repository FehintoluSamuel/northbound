name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        # Docker registry names must be all lowercase, but github.repository_owner
        # returns your username with its real capitalization (FehintoluSamuel).
        # GitHub Actions has no built-in lowercase function, so we compute it here.
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/northbound-sessions-web" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App to use the new image
        run: |
          az containerapp update \
            --name northbound-sessions.salmonmeadow-3cdbf2c1.southafricanorth.azurecontainerapps.io\
            --resource-group northbound-sessions-rg \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }}