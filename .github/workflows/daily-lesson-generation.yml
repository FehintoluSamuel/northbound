name: Run Daily Lesson Generation

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 6 AM UTC, weekdays — adjust to your real schedule
  workflow_dispatch: {}      # This lets you trigger it manually from the Actions tab too

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run lesson generator
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
          Email__Address: ${{ secrets.EMAIL_ADDRESS }} Email__AppPassword: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: dotnet run --project src/NorthboundSessions.Jobs