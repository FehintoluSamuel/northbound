# Local development only — spins up a SQL Server instance that mirrors
# what Azure SQL Database provides in production. Run: docker compose up -d
version: "3.9"
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDevPassword1!"
    ports:
      - "1433:1433"
    volumes:
      - northbound-db-data:/var/opt/mssql

volumes:
  northbound-db-data:
