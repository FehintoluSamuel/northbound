# Local development only — spins up a PostgreSQL instance, which is what the
# app actually uses (Npgsql provider + Postgres migrations). Run:
#   docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: northbound_dev
      POSTGRES_USER: northbound
      POSTGRES_PASSWORD: LocalDevPassword1!
    ports:
      - "5432:5432"
    volumes:
      - northbound-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northbound -d northbound_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  northbound-db-data:
